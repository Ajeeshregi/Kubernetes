apiVersion: apps/v1
kind: Deployment
metadata:
  name: dep-bg2
  namespace: ajeeshregi
  annotations:
    kubernetes.io/change-cause: "image tag updating to nginx:perl"
spec:
  strategy:
    type: Recreate
  replicas: 3
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
    spec:
      containers:
      - name: c1
        image: caddy